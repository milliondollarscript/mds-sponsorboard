# OneDev build specification for Million Dollar Script - SponsorBoard.

version: 1
image: php:8.2-cli

cache:
  paths:
    - vendor

steps:
  - name: "Install Composer"
    commands:
      - "curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer"

  - name: "Install Dependencies"
    commands:
      - "composer install --no-interaction --prefer-dist"

  - name: "Run Unit Tests"
    commands:
      - "composer test -- --colors=always"

  - name: "Prepare Release Artifact"
    commands:
      - "composer dump-autoload -o"
      - "zip -r mds-sponsorboard-`date +%Y%m%d`.zip . -x 'vendor/*' '*.git*' '*.idea/*' '*.vscode/*' 'tests/*' 'phpunit.xml'"

artifacts:
  - path: "mds-sponsorboard-*.zip"
    name: "SponsorBoard Release Zip"
